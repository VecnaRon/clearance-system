org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ============================================================
# API BASE URL CONFIGURATION
# ============================================================
# This is the ONLY place you need to change the backend address.
#
# - Android EMULATOR connecting to a backend running on YOUR computer:
#     API_BASE_URL=http://192.168.100.20:5000/
#   (10.0.2.2 is a special alias the emulator uses to reach
#    "localhost" on the machine that is running the emulator.)
#
# - PHYSICAL phone connecting to a backend on your computer over the
#   same Wi-Fi network:
#     API_BASE_URL=http://192.168.100.20:5000/
#   (replace 192.168.100.20 with your computer's actual LAN IP address,
#    and 5000 with the PORT value from server/.env)
#
# After changing this line, click "Sync Now" in Android Studio.
# The trailing slash "/" at the end is required by Retrofit — keep it.
# ============================================================
API_BASE_URL=http://192.168.100.6:5000/